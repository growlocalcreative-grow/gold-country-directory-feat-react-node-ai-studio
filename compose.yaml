services:
  web:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://directory:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/directory
      AUTO_MIGRATE: "true"
      AUTO_SEED: "true"
    volumes:
      - app-data:/app/var
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: directory
      POSTGRES_USER: directory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directory -d directory"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  app-data:
  postgres-data:
