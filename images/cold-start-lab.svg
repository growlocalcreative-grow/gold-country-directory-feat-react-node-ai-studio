      <stop offset="0" stop-color="#b0000d"/>
      <stop offset="0.55" stop-color="#ea6700"/>
      <stop offset="1" stop-color="#ffc501"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#bg)"/>
