<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <!--
    Cold Start Lab directory card. Client-maintained brand image referenced by
    data/client-updates.json. Colors follow coldstartlab.com (forest greens,
    warm paper, red/orange/yellow spark). The mark reproduces the owner's own
    site icon (coldstartlab.com/icon.svg). Replace this file to change the image.
  -->
  <title id="title">Cold Start Lab</title>
